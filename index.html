<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Loja</title><meta name="description" content="Produtos com entrega para todo o Brasil.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 20 20%22><text y=%2216%22 font-size=%2216%22>🏠</text></svg>">
<style>
:root{--cor-primaria:#0b6b57;--cor-escura:#16231f;--cor-fundo:#f6f4ef;--cor-destaque:#e4572e;--cor-borda:#e2ded4;--cor-suave:#6a706b;--raio:14px}
*{box-sizing:border-box}body{margin:0;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--cor-fundo);color:#1d1f1c;line-height:1.5}
[hidden]{display:none!important}:focus-visible{outline:3px solid var(--cor-destaque);outline-offset:2px}
.aviso{background:var(--cor-escura);color:#fff;text-align:center;font-size:.8rem;padding:6px 16px}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--cor-borda)}
header h1{flex:1;margin:0;font-size:1.25rem;color:var(--cor-primaria);white-space:nowrap}
header input{order:3;flex:1 0 100%;border:0;background:#f1eee6;border-radius:999px;padding:11px 16px}
@media(min-width:700px){header h1{flex:none}header input{order:0;flex:1;max-width:560px}}
select,input,textarea{font:inherit;color:inherit;padding:11px 12px;border:1px solid var(--cor-borda);border-radius:10px;background:#fff;max-width:100%}
.btn{min-height:44px;padding:11px 18px;border:0;border-radius:999px;background:var(--cor-destaque);color:#fff;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5;cursor:not-allowed}
button:not(.btn):not(.x){font:inherit;background:#fff;border:1px solid var(--cor-borda);border-radius:8px;padding:6px 10px;cursor:pointer}
#hero{padding:36px 16px 44px;background:linear-gradient(135deg,var(--cor-primaria),#0a3d33);color:#fff}
#hero h2{max-width:18ch;margin:0 0 10px;font-size:clamp(1.7rem,6vw,2.8rem);line-height:1.1}#hero p{max-width:46ch;margin:0;opacity:.9}
.filtros{display:flex;flex-wrap:wrap;align-items:center;gap:8px;max-width:1200px;margin:auto;padding:16px 16px 12px}
.titulo{flex:1 0 100%;margin:0;font-size:1.15rem}@media(min-width:700px){.titulo{flex:1}}
#grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:1200px;margin:auto;padding:0 16px 24px}
@media(min-width:700px){#grid{grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:16px}}
#grid>p{grid-column:1/-1;padding:32px 0;text-align:center;color:var(--cor-suave)}
.card{display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:var(--raio);box-shadow:0 1px 2px #0001,0 6px 18px #0000000d}
.card img{width:100%;aspect-ratio:1;object-fit:cover;background:#e9ece8}
.card h3{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em;margin:10px 12px 0;font-size:.95rem;line-height:1.3}
.card small{margin:2px 12px 0;color:var(--cor-suave)}.card>div{margin:6px 12px 0;font-size:.8rem;color:var(--cor-suave)}
.card>div b{display:block;font-size:1.2rem;color:var(--cor-primaria)}.card .btn{margin:10px 12px 12px}
dialog{width:min(560px,94vw);max-height:90vh;overflow:auto;padding:20px;border:0;border-radius:20px;background:#fff;color:#1d1f1c;box-shadow:0 20px 60px #0004}
dialog::backdrop{background:#10161488}
@media(max-width:600px){dialog{width:100%;max-width:100%;max-height:92vh;margin:auto 0 0;border-radius:20px 20px 0 0}}
dialog img{width:100%;max-height:320px;object-fit:contain;border-radius:var(--raio);background:#f1eee6}
dialog h2{margin:12px 0 4px;font-size:1.3rem}dialog label{display:block;font-size:.9rem;color:var(--cor-suave)}dialog select{width:100%}
#pp{font-size:1.6rem;color:var(--cor-primaria)}
.x{float:right;width:40px;height:40px;border:0;border-radius:50%;background:#f1eee6;font-size:1.1rem;cursor:pointer}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--cor-borda)}.li>span:first-child{flex:1}
#resumo{margin:12px 0;padding:12px 14px;border-radius:var(--raio);background:var(--cor-fundo)}
form.g{display:grid;gap:10px;margin:12px 0}.acoes{display:grid;gap:8px}
footer{padding:28px 16px 20px;background:var(--cor-escura);color:#e9efe9}
.fcols{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;max-width:1200px;margin:auto}
.fcols b{display:block;color:#fff}.fcols span{font-size:.9rem;opacity:.8}
footer #rodape{max-width:1200px;margin:20px auto 0;padding-top:14px;border-top:1px solid #ffffff22;font-size:.8rem;text-align:center;opacity:.7}
</style></head><body>
<div class="aviso">Entrega para todo o Brasil · Pedido pelo WhatsApp</div>
<header><h1 id="logo">Loja</h1><input id="q" type="search" placeholder="Buscar produto" aria-label="Buscar produto"><button class="btn" onclick="abrir()" aria-label="Abrir carrinho">🛒 <span id="n">0</span></button></header>
<section id="hero"></section>
<div class="filtros"><h2 class="titulo">Todos os produtos</h2><select id="cat" aria-label="Categoria"></select><select id="ord" aria-label="Ordenar"><option value="">Ordenar</option><option value="asc">Menor preço</option><option value="desc">Maior preço</option></select></div>
<main id="grid"></main>
<footer><div class="fcols"><div><b>Compre com segurança</b><span>Seu pedido é registrado e confirmado pelo WhatsApp.</span></div><div><b>Entrega</b><span>Frete calculado no pedido.</span></div><div><b>Atendimento</b><span>Fale com a gente pelo WhatsApp.</span></div></div><p id="rodape"></p></footer>
<dialog id="dp"></dialog>
<dialog id="dc"><button class="x" onclick="dc.close()" aria-label="Fechar">✕</button><h2>Seu carrinho</h2><div id="itens"></div>
<input id="cup" placeholder="Cupom (aplicado ao enviar o pedido)" style="width:100%"><p id="resumo"></p>
<form id="f" class="g" onsubmit="return false"><input name="nome" placeholder="Nome completo" required maxlength="120"><input name="cpf" placeholder="CPF" required inputmode="numeric" maxlength="14"><input name="email" type="email" placeholder="E-mail" maxlength="120"><input name="tel" type="tel" placeholder="Telefone" required maxlength="20">
<input name="cep" id="cep" placeholder="CEP" required inputmode="numeric" maxlength="9"><input name="end" id="end" placeholder="Endereço" required maxlength="250"><input name="num" placeholder="Número" required maxlength="20"></form>
<div class="acoes"><button class="btn" onclick="enviar()">Enviar pedido</button></div></dialog>
<script src="js/app.js"></script></body></html>
