<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Painel</title>
<style>
:root{--cor-primaria:#0b6b57;--cor-fundo:#f6f4ef;--cor-destaque:#e4572e;--cor-borda:#e2ded4;--raio:14px}
*{box-sizing:border-box}body{margin:0;font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--cor-fundo);color:#1d1f1c;line-height:1.5}
[hidden]{display:none!important}:focus-visible{outline:3px solid var(--cor-destaque);outline-offset:2px}
header{display:flex;align-items:center;gap:16px;padding:12px 16px;background:#fff;border-bottom:1px solid var(--cor-borda)}header h1{flex:1;margin:0;font-size:1.25rem;color:var(--cor-primaria)}
select,input,textarea{font:inherit;color:inherit;padding:11px 12px;border:1px solid var(--cor-borda);border-radius:10px;background:#fff;max-width:100%}
.btn{min-height:44px;padding:11px 18px;border:0;border-radius:999px;background:var(--cor-destaque);color:#fff;font:inherit;font-weight:700;cursor:pointer}
button:not(.btn){font:inherit;background:#fff;border:1px solid var(--cor-borda);border-radius:8px;padding:6px 10px;cursor:pointer}
form.g{display:grid;gap:10px;margin:12px 0}
.li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--cor-borda)}.li>span:first-child{flex:1}
.li input{min-width:0;flex:1}
</style></head><body>
<header><h1>Painel</h1><button class="btn" id="sair" hidden>Sair</button></header>
<main style="padding:16px;max-width:760px;margin:auto">
<form id="lg" class="g"><h2>Entrar</h2><input id="em" type="email" placeholder="E-mail" required autocomplete="username"><input id="se" type="password" placeholder="Senha" required autocomplete="current-password"><button class="btn">Entrar</button></form>
<div id="ap" hidden>
<p><button class="btn" onclick="aba('p')">Produtos</button> <button class="btn" onclick="aba('o')">Pedidos</button></p>
<section id="sp"><form id="fp" class="g"><h2 id="ft">Novo produto</h2>
<input id="pn" placeholder="Nome" required maxlength="200"><input id="pc" placeholder="Categoria" required maxlength="80"><textarea id="pd" placeholder="Descrição" maxlength="2000"></textarea>
<label>Foto principal <input id="pf" type="file" accept="image/jpeg,image/png,image/webp"></label><small id="pu"></small>
<h3>Variações</h3>
<textarea id="vg" rows="4" placeholder="Uma linha por opção:&#10;Cor: Preto, Branco&#10;Tamanho: P, M, G"></textarea>
<input id="vp" type="number" step="0.01" placeholder="Preço de cada variação"><input id="ve" type="number" placeholder="Estoque de cada variação">
<button type="button" class="btn" onclick="gerar()">Gerar combinações</button>
<div id="vl"></div>
<button type="button" onclick="linha()">+ linha</button>
<button class="btn">Salvar produto</button><button type="button" onclick="novo()">Limpar</button></form>
<div id="lp"></div></section>
<section id="so" hidden><div id="lo"></div></section></div></main>
<script src="js/admin.js"></script></body></html>
